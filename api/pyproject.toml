[project]
name = "breakout-api"
version = "0.1.0"
description = "Breakout stock scanning and recommendation platform: API, workers, scheduler and streamer"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "apscheduler>=3.11.3",
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.142.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "redis>=5.3.1",
    "sqlalchemy[asyncio]>=2.1.3",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ASYNC", "PT", "TID"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "tests", "alembic"]

[[tool.mypy.overrides]]
module = ["arq.*", "apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "error",
    # arq's Worker.close() calls redis-py's deprecated close(); nothing we can change.
    "ignore:Call to deprecated close:DeprecationWarning",
]
markers = [
    "integration: needs Postgres (with TimescaleDB) and Redis; run inside `make test` or CI",
]
