# Production stack for one server (see docs/deploy.md). Start with `make deploy` from the repo
# root; settings and secrets come from .env (DOMAIN, ACME_EMAIL, POSTGRES_PASSWORD and
# SESSION_SECRET are required).
#   caddy     the only public service: HTTPS on :443 (certificates from Let's Encrypt), :80
#             redirects; /api/* goes to the api, everything else to the web app
#   web       Next.js production server
#   api       FastAPI; worker (arq jobs), scheduler (the clock), streamer (live feed)
#   migrate   one-shot: database migrations + default settings, before the app starts
#   postgres  PostgreSQL 16 + TimescaleDB (no public port)
#   redis     cache, pub/sub and job queue (no public port)
#   backup    nightly pg_dump at BACKUP_TIME US/Eastern, 14 daily + 8 weekly, optional S3 copy
name: breakout-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-backend: &backend
  build:
    context: ../api
    target: prod
  image: breakout-api:prod
  env_file:
    - path: ../.env
      required: true
  environment: &backend-env
    APP_ENV: prod
    DATABASE_URL: postgresql+asyncpg://breakout:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/breakout
    REDIS_URL: redis://redis:6379/0
    PUBLIC_URL: https://${DOMAIN:?set DOMAIN in .env}
    BACKTEST_DIR: /data/backtests
    MAIL_CATCHER_HOST: ""
  volumes:
    - backtests:/data/backtests
  restart: unless-stopped
  logging: *logging
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  caddy:
    image: caddy:2.11.7-alpine
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    logging: *logging
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy

  web:
    build:
      context: ../web
      target: prod
      args:
        API_URL: http://api:8000
    image: breakout-web:prod
    environment:
      API_URL: http://api:8000
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/login').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *logging
    depends_on:
      api:
        condition: service_healthy

  migrate:
    <<: *backend
    command: ["sh", "-c", "alembic upgrade head && python -m app.cli seed"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    environment:
      <<: *backend-env
      # Requests arrive through Caddy (or the web server); the api has no public port, so trust
      # their X-Forwarded-For (login rate limits see the visitor's address).
      FORWARDED_ALLOW_IPS: "*"
      BACKUP_STATUS_FILE: /backups/last.json
    volumes:
      - backtests:/data/backtests
      - backups:/backups:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    <<: *backend
    command: ["arq", "app.worker.WorkerSettings"]

  scheduler:
    <<: *backend
    command: ["python", "-m", "app.scheduler"]

  streamer:
    <<: *backend
    command: ["python", "-m", "app.streamer"]

  postgres:
    image: timescale/timescaledb:2.30.2-pg16
    environment:
      POSTGRES_USER: breakout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: breakout
    command: ["postgres", "-c", "timezone=UTC"]
    # Parallel queries use shared memory; Docker's 64 MB default is too small.
    shm_size: 1g
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breakout -d breakout"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:8.10-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging

  backup:
    build:
      context: ./backup
    image: breakout-backup:prod
    environment:
      PGHOST: postgres
      PGUSER: breakout
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: breakout
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-14}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-8}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-breakout}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_PROVIDER: ${BACKUP_S3_PROVIDER:-Other}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
    volumes:
      - backups:/backups
    restart: unless-stopped
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
  backtests:
  backups:
