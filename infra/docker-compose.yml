# Local development stack. Start with `make dev` from the repo root.
#   web       http://localhost:3000   Next.js (proxies /api/* to the api service)
#   api       http://localhost:8000   FastAPI (docs at /api/docs)
#   worker    arq job worker
#   scheduler APScheduler, owns the market-hours schedule
#   streamer  live market data feed (Phase 6)
#   postgres  PostgreSQL 16 + TimescaleDB, localhost:5432 (breakout / breakout)
#   redis     cache, pub/sub and job queue, localhost:6379
name: breakout

x-backend: &backend
  build:
    context: ../api
    target: dev
  image: breakout-api:dev
  env_file:
    - path: ../.env
      required: false
  environment:
    # Container-network addresses always win over host addresses in .env.
    DATABASE_URL: postgresql+asyncpg://breakout:breakout@postgres:5432/breakout
    REDIS_URL: redis://redis:6379/0
  volumes:
    - ../api:/app
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: timescale/timescaledb:2.30.2-pg16
    environment:
      POSTGRES_USER: breakout
      POSTGRES_PASSWORD: breakout
      POSTGRES_DB: breakout
    command: ["postgres", "-c", "timezone=UTC"]
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breakout -d breakout"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.10-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    environment:
      DATABASE_URL: postgresql+asyncpg://breakout:breakout@postgres:5432/breakout
      REDIS_URL: redis://redis:6379/0
      # Requests arrive through the web container's /api proxy; trust its X-Forwarded-For so
      # login rate limits see the real client address.
      FORWARDED_ALLOW_IPS: "*"
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *backend
    command: ["arq", "app.worker.WorkerSettings", "--watch", "app"]

  scheduler:
    <<: *backend
    command: ["watchfiles", "--filter", "python", "python -m app.scheduler", "app"]

  streamer:
    <<: *backend
    command: ["watchfiles", "--filter", "python", "python -m app.streamer", "app"]

  web:
    build:
      context: ../web
      target: dev
    image: breakout-web:dev
    environment:
      API_URL: http://api:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ../web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
