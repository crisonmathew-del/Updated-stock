name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: timescale/timescaledb:2.30.2-pg16
        env:
          POSTGRES_USER: breakout
          POSTGRES_PASSWORD: breakout
          POSTGRES_DB: breakout
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U breakout -d breakout"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8.10-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://breakout:breakout@localhost:5432/breakout
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.30.2-pg16
        env:
          POSTGRES_USER: breakout
          POSTGRES_PASSWORD: breakout
          POSTGRES_DB: breakout
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U breakout -d breakout"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:8.10-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.23"
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - run: uv python install 3.12
        working-directory: api
      - run: uv sync --locked
        working-directory: api
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      # playwright.config.ts seeds breakout_e2e, starts the API and a production web build.
      - run: pnpm exec playwright test
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build api (prod)
        uses: docker/build-push-action@v6
        with:
          context: api
          target: prod
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web (prod)
        uses: docker/build-push-action@v6
        with:
          context: web
          target: prod
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
